name: Container

on:
  push:
    branches:
      - main
  schedule:
    # DB-IP publishes the new lite databases on the 1st around 06:30 UTC, so give them some slack
    - cron: '0 12 1 * *'
  workflow_dispatch: {}

jobs:
  docker:
    name: Container (Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and Sign container
        id: sign
        env:
          IMAGE: ghcr.io/monetr/haproxy-geoip
        run: |
          # Pick the month once and pass it into the build, this way the tags always match the data inside the image
          # even if the build happens to straddle midnight at the end of the month.
          DBIP_DATE=$(date -u +%Y-%m)
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker buildx build \
            --push \
            -f Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg DBIP_DATE=${DBIP_DATE} \
            --metadata-file metadata.json \
            --label "index:org.opencontainers.image.source=https://github.com/monetr/haproxy-geoip" \
            --label "index:org.opencontainers.image.authors=elliot.courant@monetr.app" \
            --label "index:org.opencontainers.image.vendor=monetr" \
            --label "index:org.opencontainers.image.licenses=CC-BY-4.0" \
            --label "index:org.opencontainers.image.description=DB-IP lite GeoIP data as HAProxy map files" \
            --label "index:org.opencontainers.image.version=${DBIP_DATE}" \
            --label "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/monetr/haproxy-geoip" \
            --annotation "index:org.opencontainers.image.authors=elliot.courant@monetr.app" \
            --annotation "index:org.opencontainers.image.vendor=monetr" \
            --annotation "index:org.opencontainers.image.licenses=CC-BY-4.0" \
            --annotation "index:org.opencontainers.image.description=DB-IP lite GeoIP data as HAProxy map files" \
            --annotation "index:org.opencontainers.image.version=${DBIP_DATE}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t ${IMAGE}:latest \
            -t ${IMAGE}:${DBIP_DATE} \
            -t ${IMAGE}:${DBIP_DATE}-${SHORT_SHA} \
            .
          DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          cosign sign --yes --recursive ${IMAGE}@${DIGEST}
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/monetr/haproxy-geoip
          subject-digest: ${{ steps.sign.outputs.digest }}
          push-to-registry: true
